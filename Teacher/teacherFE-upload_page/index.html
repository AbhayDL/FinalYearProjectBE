<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Programming Problem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
  </div>

  <div class="container">
    
    <div class="header">
      <h1>Upload Programming Problem</h1>
      <p>Create and configure your coding challenge</p>
    </div>

    <div class="form-card">
      <div id="problemForm">
        <!-- Problem Title -->
        <div class="form-group">
          <label for="problemTitle">Problem Title</label>
          <input type="text" id="problemTitle" name="problemTitle" class="input" placeholder="Enter a descriptive title..." />
        </div>

        <!-- Problem Description -->
        <div class="form-group">
          <label for="problemDescription">Problem Description</label>
          <textarea id="problemDescription" name="problemDescription" class="textarea" rows="5" placeholder="Provide detailed problem statement..."></textarea>
        </div>

        <!-- Input and Output Format -->
        <div class="io-row">
          <div class="form-group">
            <label for="inputFormat">Input Format</label>
            <textarea id="inputFormat" name="inputFormat" class="textarea" rows="3" placeholder="Describe the input format..."></textarea>
          </div>

          <div class="form-group">
            <label for="outputFormat">Output Format</label>
            <textarea id="outputFormat" name="outputFormat" class="textarea" rows="3" placeholder="Describe the output format..."></textarea>
          </div>
        </div>

        <!-- Constraints -->
        <div class="form-group">
          <label for="constraints">Constraints</label>
          <input type="text" id="constraints" name="constraints" class="input" placeholder="e.g., 1 ≤ N ≤ 1000" />
        </div>

        <!-- Metadata Grid -->
        <div class="grid grid-cols-3">
          <div class="form-group">
            <label for="year">Year</label>
            <select id="year" name="year" class="select">
              <option value="">Select Year</option>
              <option value="1st">1st Year</option>
              <option value="2nd">2nd Year</option>
              <option value="3rd">3rd Year</option>
              <option value="4th">4th Year</option>
            </select>
          </div>

          <div class="form-group">
            <label for="semester">Semester</label>
            <select id="semester" name="semester" class="select">
              <option value="">Select Semester</option>
              <option value="Sem 1">Sem 1</option>
              <option value="Sem 2">Sem 2</option>
              <option value="Sem 3">Sem 3</option>
              <option value="Sem 4">Sem 4</option>
              <option value="Sem 5">Sem 5</option>
              <option value="Sem 6">Sem 6</option>
              <option value="Sem 7">Sem 7</option>
              <option value="Sem 8">Sem 8</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" class="select">
              <option value="">Loading subjects...</option>
            </select>
            <p class="hint" id="subjectHint"></p>
          </div>

          <div class="form-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty" class="select">
              <option value="">Select Difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div class="form-group">
            <label for="language">Programming Language</label>
            <select id="language" name="language" class="select">
              <option value="">Select Language</option>
              <option value="54">C++ (GCC 9.2.0)</option>
              <option value="50">C (GCC 9.2.0)</option>
              <option value="62">Java (OpenJDK 13.0.1)</option>
              <option value="71">Python (3.8.1)</option>
              <option value="63">JavaScript (Node.js 12.14.0)</option>
              <option value="51">C# (Mono 6.6.0.161)</option>
              <option value="68">PHP (7.4.1)</option>
              <option value="72">Ruby (2.7.0)</option>
              <option value="73">Rust (1.40.0)</option>
              <option value="74">TypeScript (3.7.4)</option>
              <option value="60">Go (1.13.5)</option>
              <option value="78">Kotlin (1.3.70)</option>
              <option value="82">SQL (SQLite 3.27.2)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="status">Problem Status</label>
            <select id="status" class="select">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          
        </div>

        <!-- Test Cases Section -->
        <h2 class="test-cases-header">Test Cases</h2>
        <div id="testCasesList" class="test-case-list"></div>

        <button type="button" class="btn btn-add" onclick="addTestCase()">+ Add Test Case</button>

        <button type="button" class="btn btn-submit" onclick="handleSubmit()">Submit Problem</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
