<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Subject</title>
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <div class="edit-container">
    <h2>Edit Subject</h2>
    <form id="editSubjectForm" class="modal-form">
      <div class="form-group">
        <label>Subject Name</label>
        <input type="text" id="subjectName" required>
      </div>
      <div class="form-group">
        <label>Subject Code</label>
        <input type="text" id="subjectCode" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="subjectDesc"></textarea>
      </div>
      <div class="form-group">
        <label>Assign Teacher</label>
        <select id="subjectTeacher"></select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select id="subjectYear">
          <option value="">Select Year</option>
          <option value="1st">1st Year</option>
          <option value="2nd">2nd Year</option>
          <option value="3rd">3rd Year</option>
          <option value="4th">4th Year</option>
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select id="subjectSem">
          <option value="">Select Semester</option>
          <option value="Sem 1">Sem 1</option>
          <option value="Sem 2">Sem 2</option>
          <option value="Sem 3">Sem 3</option>
          <option value="Sem 4">Sem 4</option>
          <option value="Sem 5">Sem 5</option>
          <option value="Sem 6">Sem 6</option>
          <option value="Sem 7">Sem 7</option>
          <option value="Sem 8">Sem 8</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
  <script src="edit-subject.js"></script>
</body>
</html>
