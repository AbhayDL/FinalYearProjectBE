<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CodeRunner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #0f172a;
      --surface: rgba(15, 23, 42, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #f59e0b;
      --shadow: 0 30px 60px -35px rgba(2, 6, 23, 0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      background-image:
        radial-gradient(900px circle at 10% 10%, rgba(56, 189, 248, 0.14), transparent 45%),
        radial-gradient(800px circle at 85% 15%, rgba(245, 158, 11, 0.12), transparent 45%),
        linear-gradient(180deg, var(--bg), var(--bg-2) 60%, var(--bg));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      color: var(--text);
    }

    .login-container {
      width: 100%;
      max-width: 450px;
    }

    .login-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      border: 1px solid var(--border);
      padding: 3rem 2rem;
      box-shadow: var(--shadow);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, var(--accent), #60a5fa, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem;
      background: rgba(2, 6, 23, 0.55);
      border: 2px solid rgba(148, 163, 184, 0.2);
      border-radius: 0.85rem;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(2, 6, 23, 0.85);
    }

    .login-btn {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      color: #0b1020;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #60a5fa, var(--accent));
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -20px rgba(56, 189, 248, 0.6);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .status {
      padding: 0.75rem;
      border-radius: 0.75rem;
      text-align: center;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }

    .status.error {
      background: rgba(248, 113, 113, 0.15);
      color: #fecdd3;
      border: 1px solid rgba(248, 113, 113, 0.3);
      display: block;
    }

    .status.success {
      background: rgba(52, 211, 153, 0.18);
      color: #a7f3d0;
      border: 1px solid rgba(52, 211, 153, 0.3);
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 1. Make the wrapper the reference point for the button */
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

/* 2. Style the input to have room for the icon on the right */
.password-wrapper input {
  width: 100%;
  padding: 12px;
  padding-right: 45px; 
  border-radius: 8px; 
  border: 1px solid rgba(148, 163, 184, 0.2);
  box-sizing: border-box;
}

/* 3. Position the button absolutely inside the wrapper */
.eye-btn {
  position: absolute;
  right: 10px; /* Adjust as needed */
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted); /* Icon color */
}


  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
        <p>CodeRunner Administration</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="admin@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" id="togglePassword" aria-label="Show password" class="eye-btn">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          Signing in...
        </div>

        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const BASE_URL = localStorage.getItem("API_BASE_URL") || "http://localhost:4000";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const loading = document.getElementById("loading");
      const status = document.getElementById("status");

      loading.style.display = "block";
      status.classList.remove("error", "success");
      status.textContent = "";

      try {
        const res = await fetch(`${BASE_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || "Login failed");
        }

        // Check if user is admin
        if (data.user.role !== "admin") {
          throw new Error("Admin access required");
        }

        // Save token
        localStorage.setItem("API_BASE_URL", BASE_URL);
        localStorage.setItem("adminToken", data.token);
        localStorage.setItem("adminUser", JSON.stringify(data.user));

        status.classList.add("success");
        status.textContent = "✅ Login successful! Redirecting...";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (error) {
        loading.style.display = "none";
        status.classList.add("error");
        status.textContent = `❌ ${error.message}`;
      }
    });
  </script>
  <script>
    // Toggle password visibility
    (function () {
      const toggle = document.getElementById('togglePassword');
      const pwd = document.getElementById('password');
      if (!toggle || !pwd) return;
      toggle.addEventListener('click', () => {
        const isPassword = pwd.getAttribute('type') === 'password';
        pwd.setAttribute('type', isPassword ? 'text' : 'password');
        toggle.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        toggle.setAttribute('aria-pressed', String(isPassword));
      });
    })();
  </script>
</body>
</html>
