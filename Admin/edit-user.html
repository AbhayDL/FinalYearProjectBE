<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User</title>
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <div class="edit-container">
    <h2>Edit User</h2>
    <form id="editUserForm" class="modal-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="userName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="userEmail" required>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="userRole" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="userStatus" required>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department</label>
        <select id="userDepartment">
          <option value="">Select Department</option>
        </select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select id="userYear">
          <option value="">Select Year</option>
          <option value="1st">1st Year</option>
          <option value="2nd">2nd Year</option>
          <option value="3rd">3rd Year</option>
          <option value="4th">4th Year</option>
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select id="userSemester">
          <option value="">Select Semester</option>
          <option value="Sem 1">Sem 1</option>
          <option value="Sem 2">Sem 2</option>
          <option value="Sem 3">Sem 3</option>
          <option value="Sem 4">Sem 4</option>
          <option value="Sem 5">Sem 5</option>
          <option value="Sem 6">Sem 6</option>
          <option value="Sem 7">Sem 7</option>
          <option value="Sem 8">Sem 8</option>
        </select>
      </div>
      <div class="form-group">
        <label>New Password (leave blank to keep unchanged)</label>
        <div style="position:relative;">
          <input type="password" id="userPassword" autocomplete="new-password" style="padding-right:32px;">
          <button type="button" id="toggleUserPassword" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">
            <span id="eyeIconUser">👁️</span>
          </button>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
  <script src="edit-user.js"></script>
  <script>
    const userPassword = document.getElementById('userPassword');
    const toggleUserPassword = document.getElementById('toggleUserPassword');
    const eyeIconUser = document.getElementById('eyeIconUser');
    if (toggleUserPassword) {
      toggleUserPassword.addEventListener('click', function() {
        if (userPassword.type === 'password') {
          userPassword.type = 'text';
          eyeIconUser.textContent = '🙈';
        } else {
          userPassword.type = 'password';
          eyeIconUser.textContent = '👁️';
        }
      });
    }
  </script>
</body>
</html>
